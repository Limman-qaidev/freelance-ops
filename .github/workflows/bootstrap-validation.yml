name: Bootstrap validation

on:
  push:
    branches:
      - codex/fnd-001-scaffold
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install from generated lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify Expo web export
        run: npx expo export --platform web --output-dir dist-ci

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error

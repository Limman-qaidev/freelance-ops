name: UI-005 dependency install (temporary)

on:
  push:
    branches:
      - codex/ui-005-design-system

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ui-005-design-system
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo install @expo/vector-icons
      - name: Commit generated dependency metadata and remove temporary workflow
        run: |
          rm .github/workflows/temp-ui005-deps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/temp-ui005-deps.yml
          git commit -m "build: add Expo vector icons dependency"
          git push origin HEAD:codex/ui-005-design-system
